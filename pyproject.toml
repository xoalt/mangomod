[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mangomod"
dynamic = ["version"]
description = "A graphical Mango compositor configuration editor, ported from NiriMod"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "LICENSES/*.txt"]
requires-python = ">=3.12"
# GTK bindings are system packages; installation commands are in README.md.
dependencies = []

[project.scripts]
mangomod = "mangomod.__main__:main"

[tool.hatch.version]
path = "mangomod/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["mangomod"]

[tool.hatch.build.targets.sdist]
include = [
    "/mangomod", "/data", "/tests", "/docs",
    "/LICENSE", "/LICENSES", "/README.md",
    "/install.sh", "/pyproject.toml",
]
